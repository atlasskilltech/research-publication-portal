
name: Deploy to EC2 Server of atlasliving (ATLAS RESEARCH PORTAL)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

          trap 'rm -f ~/.ssh/key.pem' EXIT

          ssh -i ~/.ssh/key.pem \
            -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /home/ubuntu/research-publication-portal

            # Discard only local changes to the lockfile
            git restore -- package-lock.json

            # Pull the latest committed code
            git pull --ff-only origin main

            # Install dependencies and build
            npm ci
            npm run build

            # Restart the existing application
            pm2 reload research-publication-portal
            pm2 save
          EOF
